name: Release

# Cut a release by tagging a commit:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match the version in build.zig.zon, which is checked first.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  ZIG_VERSION: 0.16.0

permissions:
  contents: write

jobs:
  check-version:
    name: Tag matches build.zig.zon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          zon=$(grep -oP '\.version = "\K[^"]+' build.zig.zon)
          tag="${GITHUB_REF_NAME#v}"
          echo "build.zig.zon: $zon"
          echo "tag:           $tag"
          if [ "$zon" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match build.zig.zon version $zon."
            echo "::error::Bump build.zig.zon, or tag v$zon instead."
            exit 1
          fi

  linux:
    # Built on 22.04 rather than latest so the binary runs on older glibc too.
    # No -Dtarget: naming the target turns off Zig's native library search,
    # and raylib needs the host's GL and X11 libraries.
    name: Build linux
    needs: check-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxcursor-dev libxkbcommon-dev
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

        # -Dcpu=baseline: without it a native build targets the runner's own
        # CPU, and the binary dies with SIGILL on anything older.
        # -Dself-update: only builds from here install new releases themselves.
      - run: zig build -Dcpu=baseline -Doptimize=ReleaseSafe -Dself-update=true

        # The v0.1.0 binaries shipped with AVX in them and died with SIGILL on
        # older processors. A baseline x86-64 build has no VEX-encoded
        # instruction in it at all, so this fails the release rather than
        # publishing one that crashes on someone else's machine.
      - name: Check the binary is really baseline
        run: |
          count=$(objdump -d --no-show-raw-insn zig-out/bin/Zimacs \
            | awk '{print $2}' | grep -cE '^v[a-z]' || true)
          echo "VEX-encoded instructions: $count"
          test "$count" -eq 0

        # The bare binary, signed, is what installed copies download to
        # update themselves. The script refuses to sign with a key that does
        # not match the one compiled into Zimacs.
      - name: Sign for self-update
        env:
          ZIMACS_SIGNING_KEY: ${{ secrets.ZIMACS_SIGNING_KEY }}
        run: sh scripts/sign-update.sh zig-out/bin/Zimacs zimacs-linux-x86_64 linux-x86_64 "${GITHUB_REF_NAME#v}"

      - name: Package
        run: |
          name="zimacs-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "$name"
          cp zig-out/bin/Zimacs README.md LICENSE "$name/"
          cp assets/logo/zimacs-256.png "$name/zimacs.png"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          ls -la "$name.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: |
            zimacs-*.tar.gz*
            zimacs-linux-x86_64
            zimacs-linux-x86_64.sig

  windows:
    # Cross-compiled: Windows needs nothing from the host.
    name: Build windows
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - run: zig build -Dtarget=x86_64-windows -Dcpu=baseline -Doptimize=ReleaseSafe -Dself-update=true

      - name: Check the binary is really baseline
        run: |
          count=$(objdump -d --no-show-raw-insn zig-out/bin/Zimacs.exe \
            | awk '{print $2}' | grep -cE '^v[a-z]' || true)
          echo "VEX-encoded instructions: $count"
          test "$count" -eq 0

      - name: Sign for self-update
        env:
          ZIMACS_SIGNING_KEY: ${{ secrets.ZIMACS_SIGNING_KEY }}
        run: sh scripts/sign-update.sh zig-out/bin/Zimacs.exe zimacs-windows-x86_64.exe windows-x86_64 "${GITHUB_REF_NAME#v}"

      - name: Package
        run: |
          name="zimacs-${GITHUB_REF_NAME}-windows-x86_64"
          mkdir -p "$name"
          cp zig-out/bin/Zimacs.exe README.md LICENSE "$name/"
          cp assets/logo/zimacs-256.png "$name/zimacs.png"
          zip -qr "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"
          ls -la "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: |
            zimacs-*.zip*
            zimacs-windows-x86_64.exe
            zimacs-windows-x86_64.exe.sig

  publish:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'zimacs-*.tar.gz*' -o -name 'zimacs-*.zip*' \
            -o -name 'zimacs-*-x86_64' -o -name 'zimacs-*-x86_64.exe' -o -name 'zimacs-*.sig' \) \
            -exec cp {} release/ \;
          ls -la release
          # A release without its signed binaries would leave every installed
          # copy stuck on the version before it.
          for f in zimacs-linux-x86_64 zimacs-linux-x86_64.sig \
                   zimacs-windows-x86_64.exe zimacs-windows-x86_64.exe.sig; do
            test -s "release/$f" || { echo "missing $f"; exit 1; }
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
