<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zimacs</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #181818; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; border: 0; outline: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  // Tells a page embedding this in an iframe when there is something to look
  // at. Runtime init means the wasm is live but nothing is drawn yet, so this
  // waits for two frames rather than reporting ready against a blank canvas.
  function announceReady() {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        try { parent.postMessage({ zimacs: 'ready' }, '*'); } catch (e) {}
      });
    });
  }
  // The browser keeps shortcuts such as Ctrl+F and Ctrl+= for itself unless
  // the page claims them. These are the editor's. Copy, cut and paste stay
  // with the browser so the clipboard works, and so do the save, open and
  // reload keys, since the editor cannot save or open files here.
  var editorKeys = /^(Key[ADFGHKLYZ]|Equal|Minus|Digit[0-9]|Enter)$/;
  window.addEventListener('keydown', function (e) {
    if (e.code === 'F3' || (e.ctrlKey && !e.altKey && editorKeys.test(e.code))) e.preventDefault();
  }, true);

  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (text) { console.log(text); },
    printErr: function (text) { console.error(text); },
    onRuntimeInitialized: announceReady,
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
